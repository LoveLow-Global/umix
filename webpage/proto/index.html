<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>um!x Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: one iPhone 17 Pro (402 × 874 pt) on a neutral stage. 24px content gutter, 32px between sections.
   Controls follow a bare-bones liquid glass system: translucent capsules and circles over white. */
:root{
  --bg:#FAF8F3; --bg2:#F0EDE5; --fill:rgba(110,98,80,.11); --stage:#E2DED4;
  --label:#1C1A17; --label2:#6D685F; --sep:rgba(70,60,45,.15);
  --glass:rgba(238,234,226,.34); --glassEdge:rgba(255,255,255,.78); --glassHi:rgba(255,255,255,.95); --glassLo:rgba(255,255,255,.5); --glassGlow:rgba(255,255,255,.35); --glassLine:rgba(60,50,35,.07);
  --primGlass:rgba(30,28,24,.78); --sheet:rgba(251,249,245,.92); --scrim:rgba(30,25,15,.2);
  --prim:#1C1A17; --onprim:#FAF8F3; --tint:#1C1A17;
  --film:#D2603F; --music:#5E9150; --book:#4A6FB0; --thing:#C8952A; --image:#C9668A;
  --serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Pretendard","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --g:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151412; --bg2:#22201C; --fill:rgba(160,150,130,.18); --stage:#0C0B0A;
  --label:#F5F2EC; --label2:#A6A095; --sep:rgba(120,110,95,.4);
  --glass:rgba(70,66,60,.32); --glassEdge:rgba(255,255,255,.22); --glassHi:rgba(255,255,255,.32); --glassLo:rgba(255,255,255,.08); --glassGlow:rgba(255,255,255,.05); --glassLine:rgba(0,0,0,.3);
  --primGlass:rgba(245,242,236,.85); --sheet:rgba(32,30,27,.93); --scrim:rgba(0,0,0,.5);
  --prim:#F5F2EC; --onprim:#1C1A17; --tint:#F5F2EC;
  --film:#FF7452; --music:#6CC15F; --book:#6E9BEB; --thing:#FFC22E; --image:#FF7AA8; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#151412; --bg2:#22201C; --fill:rgba(160,150,130,.18); --stage:#0C0B0A;
  --label:#F5F2EC; --label2:#A6A095; --sep:rgba(120,110,95,.4);
  --glass:rgba(70,66,60,.32); --glassEdge:rgba(255,255,255,.22); --glassHi:rgba(255,255,255,.32); --glassLo:rgba(255,255,255,.08); --glassGlow:rgba(255,255,255,.05); --glassLine:rgba(0,0,0,.3);
  --primGlass:rgba(245,242,236,.85); --sheet:rgba(32,30,27,.93); --scrim:rgba(0,0,0,.5);
  --prim:#F5F2EC; --onprim:#1C1A17; --tint:#F5F2EC;
  --film:#FF7452; --music:#6CC15F; --book:#6E9BEB; --thing:#FFC22E; --image:#FF7AA8; color-scheme:dark }

html,body{height:100%}
body{background:var(--stage);color:var(--label);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* stage + device */
.stage{height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{--top:54px;--bot:30px;position:relative;width:min(402px,100%,calc((100vh - 56px) * 402 / 874));width:min(402px,100%,calc((100dvh - 56px) * 402 / 874));aspect-ratio:402/874;
  background:var(--bg);border-radius:58px;overflow:hidden;
  box-shadow:0 0 0 9px #1C1C1E,0 0 0 10px #48484A,0 40px 80px -30px rgba(0,0,0,.5)}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:124px;height:36px;border-radius:18px;background:#000;z-index:60;pointer-events:none}
.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--label);opacity:.85;z-index:60;pointer-events:none}
@media (max-width:500px){
  .stage{padding:0}
  .phone{width:100%;height:100%;aspect-ratio:auto;border-radius:0;box-shadow:none;--top:6px;--bot:10px}
  .island,.homebar{display:none}
}
#screen{position:absolute;inset:0;padding-top:var(--top);display:flex;flex-direction:column;box-sizing:border-box}
.scroll{flex:1;overflow-y:auto;padding:0 var(--g) 128px;-webkit-overflow-scrolling:touch}

/* type */
.lt{font-family:var(--serif);font-size:34px;font-weight:400;letter-spacing:-.02em;line-height:1.08;margin:0;text-wrap:balance}
.lt i,.t3 i{font-style:italic}
.t2{font-family:var(--serif);font-size:24px;font-weight:400;letter-spacing:-.01em;margin:0}
.t3{font-family:var(--serif);font-size:23px;font-weight:400;letter-spacing:-.01em;margin:0}
.body{font-size:17px;line-height:1.45;margin:0}
.sub{font-size:15px;line-height:1.45;color:var(--label2);margin:0}
.fn{font-size:13px;line-height:1.4;color:var(--label2);margin:0}

/* liquid glass */
.glass,.btn,.tbtn,.alt button{background:var(--glass);-webkit-backdrop-filter:blur(9px) saturate(210%) brightness(1.04);backdrop-filter:blur(9px) saturate(210%) brightness(1.04);
  border:1px solid var(--glassEdge);color:var(--label);
  box-shadow:inset 0 1.5px 1px var(--glassHi),inset 0 -1.5px 1px var(--glassLo),inset 0 0 16px var(--glassGlow),0 0 0 .5px var(--glassLine),0 8px 24px rgba(40,30,15,.07)}
.circ{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;padding:0;flex-shrink:0}
.btn{height:52px;border-radius:26px;font-size:17px;font-weight:600;padding:0 24px}
.btn.prim,.alt button[aria-pressed="true"]{background:var(--primGlass);color:var(--onprim);border-color:rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.1)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.tbtn{height:36px;border-radius:18px;font-size:15px;font-weight:600;padding:0 14px}
.tbtn.sm{font-size:14px;height:34px}
.row-actions{display:flex;gap:12px;margin-top:28px}
.row-actions .btn{flex:1}

/* segmented control (glass) */
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:20px;background:var(--fill)}
.segc button{height:34px;border:0;border-radius:17px;background:transparent;font-size:14px;font-weight:500;color:var(--label);padding:0 4px;white-space:nowrap}
.segc button[aria-selected="true"]{background:var(--glass);box-shadow:inset 0 1px 0 var(--glassHi),inset 0 -1px 0 var(--glassLo),0 1px 4px rgba(40,30,15,.1);font-weight:600}

/* grouped list */
.group{background:var(--bg2);border-radius:20px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 18px;box-sizing:border-box;width:100%;border:0;background:none;text-align:left;position:relative}
.li+.li::before{content:"";position:absolute;top:0;right:0;left:18px;border-top:.5px solid var(--sep)}
.li.ind+.li.ind::before{left:62px}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-size:17px;font-weight:500}
.li .m span{display:block;font-size:14px;color:var(--label2);margin-top:2px;line-height:1.35}
.li .v{color:var(--label2);font-size:16px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.ghead{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;margin:32px 18px 8px}
.gfoot{font-size:13px;color:var(--label2);line-height:1.4;margin:8px 18px 0}
.check{color:var(--tint)}
.tile{width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex-shrink:0}

/* switch */
.switch{width:51px;height:31px;border-radius:16px;border:0;background:var(--fill);padding:0;position:relative;flex-shrink:0;transition:background .2s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:#34C759}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch[disabled]{opacity:.4;cursor:default}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px var(--g) 10px;min-height:56px;box-sizing:border-box}
.top .r{display:flex;gap:10px}
.logo{border:0;background:none;padding:0;width:44px;height:44px;display:grid;place-items:center}

/* floating header: content scrolls underneath */
#screen.flush{padding-top:0}
.scroll.under{padding-top:calc(var(--top) + 60px)}
.top.float{position:absolute;top:var(--top);left:0;right:0;z-index:6;pointer-events:none}
.top.float>*{pointer-events:auto}
.fadelogo{transition:opacity .15s}
.edge{position:absolute;top:0;left:0;right:0;height:calc(var(--top) + 70px);z-index:5;pointer-events:none;opacity:0;transition:opacity .2s;
  background:linear-gradient(var(--bg) 0%,color-mix(in srgb,var(--bg) 75%,transparent) 50%,color-mix(in srgb,var(--bg) 0%,transparent) 100%);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent)}
.sbox{position:absolute;right:var(--g);top:6px;height:44px;width:44px;border-radius:22px;display:flex;align-items:center;overflow:hidden;box-sizing:border-box;transition:width .38s cubic-bezier(.3,.8,.25,1)}
.sbox .sbtn{width:42px;height:42px;flex-shrink:0;border:0;background:none;display:grid;place-items:center;padding:0;color:var(--label)}
.sbox input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:17px;color:var(--label);outline:none;opacity:0;transition:opacity .2s;padding:0}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox .sx{width:34px;height:34px;flex-shrink:0;border:0;border-radius:17px;background:var(--fill);display:none;place-items:center;padding:0;margin-right:4px;color:var(--label2)}
.sbox.open{width:calc(100% - var(--g) * 2)}
.sbox.open input{opacity:1}
.sbox.open .sx{display:grid}
.sres{position:absolute;left:var(--g);right:var(--g);top:calc(var(--top) + 60px);max-height:calc(100% - var(--top) - 180px);overflow-y:auto;border-radius:24px;padding:4px 14px;z-index:6;box-sizing:border-box;
  background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glassEdge);box-shadow:0 12px 40px rgba(0,0,0,.14);animation:pop .2s cubic-bezier(.2,.8,.3,1.1) both;transform-origin:top right}
.sres .irow{border:0;background:none;width:100%;text-align:left;padding:10px 0}

/* tab bar */
.tabbar{position:absolute;left:20px;right:20px;bottom:calc(var(--bot) + 4px);display:flex;gap:12px;z-index:5;align-items:center}
.tabs{flex:1;height:62px;border-radius:31px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px;box-sizing:border-box}
.tabs button{border:0;border-radius:27px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--label)}
.tabs button[aria-current="page"]{background:var(--fill);color:var(--label)}
.fab{width:62px;height:62px;border-radius:31px;padding:0;display:grid;place-items:center}

/* board */
.prof{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:22px;background:var(--bg2);display:grid;place-items:center;font-size:17px;font-weight:600;color:var(--label2);flex-shrink:0}
.mapname{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;text-align:left;margin-top:28px}
.map{position:relative;margin-top:20px;border-radius:28px;background:var(--bg2);overflow:hidden}
.map svg{display:block;width:100%;height:auto}
svg text{font-family:var(--sans)}
.node{cursor:pointer;outline:none}
.node:focus-visible .hit{stroke:var(--tint);stroke-width:2}
.hit{fill:transparent}
.bloom{transform-box:fill-box;transform-origin:center;animation:bloom .9s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:var(--d,0s)}
@keyframes bloom{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.draw{stroke-dasharray:1;animation:draw 1.6s ease both;animation-delay:var(--d,0s)}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.pulse{animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* board (fixed, no scroll) */
.boardwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 var(--g) calc(var(--bot) + 92px)}
.boardwrap .mapname{margin-top:20px}
.mapbtn{flex:1;min-height:0;width:100%;border:0;padding:0;margin-top:16px;cursor:pointer;display:block;position:relative}
.mapbtn svg{width:100%;height:100%;pointer-events:none}
.openhint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);height:36px;border-radius:18px;padding:0 16px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;white-space:nowrap;pointer-events:none}
/* full interactive map */
.full{position:absolute;inset:0;background:var(--bg)}
.graph{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.graph:active{cursor:grabbing}
.graph .gn{cursor:pointer;outline:none}
.graph .gn:focus-visible circle:first-child{stroke:var(--label);stroke-width:1.5}
.fulltop{position:absolute;top:var(--top);left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px var(--g);pointer-events:none}
.fulltop>*{pointer-events:auto}
.fulltop .ttl{font-family:var(--serif);font-style:italic;font-size:21px;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.fullhint{position:absolute;left:50%;bottom:calc(var(--bot) + 18px);transform:translateX(-50%);height:40px;border-radius:20px;padding:0 18px;display:flex;align-items:center;font-size:14px;font-weight:500;white-space:nowrap;pointer-events:none;animation:hintout 1s ease 4s forwards}
@keyframes hintout{to{opacity:0}}

/* account */
.acc-top{display:flex;align-items:center;gap:22px;margin-top:8px}
.av.big{width:86px;height:86px;border-radius:43px;font-family:var(--serif);font-size:36px;font-weight:400;color:var(--label);background:var(--bg2);box-shadow:inset 0 0 0 1px var(--sep)}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{border:0;background:none;padding:6px 0;text-align:center;border-radius:14px}
.stat b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:13px;color:var(--label2);margin-top:2px}
button.stat:active{background:var(--fill)}
.li .v.chev{color:var(--label2)}
.inp{width:100%;box-sizing:border-box;border:0;border-radius:14px;background:var(--fill);color:var(--label);font:inherit;font-size:17px;padding:12px 14px;margin-top:6px;outline:none;resize:none}
.inp:focus{box-shadow:0 0 0 2px var(--label)}
.flabel{display:block;font-size:13px;color:var(--label2);margin-top:20px}

/* generated covers */
.cv{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;color:#fff;container-type:inline-size;isolation:isolate;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18),0 1px 2px rgba(40,30,15,.08)}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.34));z-index:0}
.cv>*{position:absolute;z-index:1}
.cvg{right:-14%;bottom:-14%;width:72%;height:72%;opacity:.26;z-index:0}
.cvk{left:9%;top:8%;font-size:6.2cqi;letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.85}
.cvt{left:9%;right:9%;bottom:19%;font-family:var(--serif);font-size:11.5cqi;line-height:1.04;letter-spacing:-.01em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cvb{left:9%;right:9%;bottom:8%;font-size:6.2cqi;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv.wide{aspect-ratio:4/3;border-radius:24px}
.cv.wide .cvt{font-size:9.5cqi;bottom:17%}.cv.wide .cvk,.cv.wide .cvb{font-size:4.2cqi}
.cv.round{border-radius:50%}
.cv.round .cvk,.cv.round .cvb{display:none}
.cv.round .cvt{left:14%;right:14%;top:50%;bottom:auto;transform:translateY(-50%);text-align:center;font-size:13cqi}
.cv.round .cvg{right:auto;bottom:auto;left:14%;top:14%;width:72%;height:72%;opacity:.18}
/* discover sections */
.dsec{margin-top:36px}
.dsec .sechead{margin-top:0}
.dsec .why2{font-size:14px;color:var(--label2);margin:2px 0 0}
.hrow{display:flex;gap:12px;overflow-x:auto;margin:14px calc(var(--g) * -1) 0;padding:0 var(--g) 6px;scroll-snap-type:x mandatory;scroll-padding:0 var(--g);scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.tb{flex:0 0 150px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left}
.tb .cap{display:block;font-size:13px;color:var(--label2);margin-top:8px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{display:block;width:100%;border:0;background:none;padding:0;text-align:left;margin-top:32px}
.hero .k{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.hero .r{font-size:16px;line-height:1.45;margin-top:12px}
.pair{flex:0 0 288px;scroll-snap-align:start;border:0;border-radius:24px;background:var(--bg2);padding:12px;text-align:left;display:flex;flex-direction:column;gap:10px}
.pair .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.pair .eq{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:15px;z-index:2}
.pair .pc{font-family:var(--serif);font-size:17px;line-height:1.3;padding:0 4px 4px}
.pair .pc i{font-style:italic}
.mix{flex:0 0 272px;scroll-snap-align:start;border:0;border-radius:24px;padding:0;text-align:left;overflow:hidden;color:#fff;position:relative;height:200px}
.mix svg{position:absolute;inset:0;width:100%;height:100%}
.mix .mt{position:absolute;left:18px;right:18px;bottom:16px;z-index:1}
.mix .mt b{display:block;font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.1}
.mix .mt span{display:block;font-size:13px;opacity:.85;margin-top:4px}
.pcard{flex:0 0 240px;scroll-snap-align:start;border:0;border-radius:24px;background:var(--bg2);padding:12px;text-align:left;display:flex;flex-direction:column;gap:10px}
.pcard .three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pcard .three .cv{border-radius:10px}
.pcard b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:19px;padding:0 4px}
.pcard span{font-size:13px;color:var(--label2);padding:0 4px 4px;margin-top:-6px}
.bentry{display:flex;align-items:center;gap:16px;width:100%;border:0;border-radius:24px;background:var(--bg2);padding:14px 16px 14px 14px;text-align:left;margin-top:24px}
.bentry .m{flex:1;min-width:0}
.bentry b{display:block;font-size:17px;font-weight:600}
.bentry span{display:block;font-size:14px;color:var(--label2);margin-top:2px}
.endcard{margin-top:44px;padding:36px 24px 30px;border-radius:28px;background:var(--bg2);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.endcard h2{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.15;margin:8px 0 0}
.endcard h2 i{font-style:italic}
.endcard .row-actions{width:100%;margin-top:14px}
/* bubble explorer */

/* ---------- glyphs: one shape per medium ---------- */
function glyph(t,r,ghost,col){
  const c=col||`var(--${t})`,op=ghost?.25:.9,sw=ghost?1:1.4,d=ghost?' stroke-dasharray="3 3"':'';let s='';
  if(t==='film')s=`<circle r="${f(r*.6)}" fill="${c}" fill-opacity="${op}"/><circle r="${f(r)}" fill="none" stroke="${c}" stroke-width="${sw}"${d}/>`;
  else if(t==='music'){for(let i=0;i<12;i++){const a=i/12*Math.PI*2;s+=`<line x1="${f(Math.cos(a)*r*.38)}" y1="${f(Math.sin(a)*r*.38)}" x2="${f(Math.cos(a)*r)}" y2="${f(Math.sin(a)*r)}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-opacity="${ghost?.55:1}"/>`}s+=`<circle r="${f(r*.24)}" fill="${c}" fill-opacity="${op}"/>`}
  else if(t==='book')s=`<path d="M0,${f(-r)} Q${f(r*.85)},0 0,${f(r)} Q${f(-r*.85)},0 0,${f(-r)}Z" fill="${c}" fill-opacity="${op*.85}" stroke="${c}" stroke-width="${sw}"${d}/>`+(ghost?'':`<line y1="${f(-r)}" y2="${f(r)}" stroke="#fff" stroke-width="1" opacity=".7"/>`);
  else if(t==='thing'){const p=[0,1,2].map(i=>{const a=-Math.PI/2+i*2*Math.PI/3;return `${f(Math.cos(a)*r)},${f(Math.sin(a)*r)}`}).join(' ');s=`<polygon points="${p}" fill="${c}" fill-opacity="${op*.85}" stroke="${c}" stroke-width="${sw}" stroke-linejoin="round"${d}/>`}
  else{for(let i=0;i<5;i++)s+=`<ellipse cy="${f(-r*.52)}" rx="${f(r*.3)}" ry="${f(r*.5)}" transform="rotate(${i*72})" fill="${c}" fill-opacity="${op*.72}" stroke="${c}" stroke-width="${sw*.8}"${d}/>`;s+=`<circle r="${f(r*.16)}" fill="#fff"/>`}
  return s;
}
const icon=(t,size,ghost)=>`<svg width="${size}" height="${size}" viewBox="${-size/2} ${-size/2} ${size} ${size}" aria-hidden="true">${glyph(t,size/2-2,ghost)}</svg>`;
function flower(size){
  const cols=['film','music','book','thing','image'];
  const p=cols.map((c,i)=>`<ellipse cy="-5.4" rx="3.3" ry="5.6" fill="var(--${c})" fill-opacity=".92" transform="rotate(${i*72})"/>`).join('');
  return `<svg width="${size}" height="${size}" viewBox="-12 -12 24 24" aria-hidden="true"><g transform="rotate(18)">${p}</g><circle r="1.9" fill="var(--bg)"/></svg>`;
}
const logo=(size)=>`<button class="logo" data-act="wm" aria-label="um!x">${flower(size||30)}</button>`;

/* ---------- the fake engine ---------- */
function rank(items,exclude,forced){
  const prof=S.priv&&S.priv.quiz===false?{}:S.profile;
  const list=Object.values(CAT).filter(c=>!exclude.has(c.id)).map(c=>{
    let best=null,bs=0,sum=0;
    items.forEach(b=>{const bt=CAT[b]?CAT[b].tags:[];const sh=c.tags.filter(t=>bt.includes(t)).length;sum+=sh;if(sh>bs){bs=sh;best=b}});
    const p=c.tags.reduce((s,t)=>s+(prof[t]||0),0);
    const fi=forced.indexOf(c.id);
    return{id:c.id,sc:sum+p*.6+(fi>=0?1000-fi:0),forced:fi>=0,from:best,shared:best?c.tags.filter(t=>CAT[best].tags.includes(t)):[]};
  }).sort((a,b)=>b.sc-a.sc);
  const max=Math.max(1,...list.filter(x=>!x.forced).map(x=>x.sc));
  list.forEach(x=>x.s=x.forced?.95:Math.max(.15,Math.min(1,x.sc/max)));
  return list;
}
function hunches(b){return rank(b.items,new Set([...b.items,...b.dismissed]),b.forced).slice(0,3)}
function discoverList(){
  const b=cur(),all=new Set(S.boards.flatMap(x=>x.items).concat(b.dismissed));
  const r=rank(b.items,all,S.pin);const out=[],per={};
  for(const x of r){const t=CAT[x.id].t;if(S.dfilt!=='all'&&t!==S.dfilt)continue;
    if(S.dfilt==='all'&&!x.forced&&(per[t]||0)>=2)continue;per[t]=(per[t]||0)+1;out.push(x);if(out.length===6)break}
  return out;
}
function why(x){
  if(x.forced&&!x.from)return 'Picked for you this week.';
  if(x.from)return `People who saved ${CAT[x.from].title} also saved this`+(x.shared.length?`. You both seem to like things that feel ${x.shared.slice(0,2).join(' and ')}.`:'.');
  return 'It matches what you told us you like.';
}
const conf=s=>`<div class="conf"><span>Match</span><span class="bar"><i style="width:${Math.round(s*100)}%"></i></span><span>${s>.8?'Strong':s>.5?'Good':'Worth a try'}</span></div>`;
function buildProfile(){
  const p={};S.answers.forEach((a,i)=>{if(!a)return;const q=QS[i];
    const add=(tags,w)=>tags.forEach(t=>p[t]=(p[t]||0)+w);
    if(a==='a')add(q.a.tags,2);else if(a==='b')add(q.b.tags,2);else if(a==='both'){add(q.a.tags,1);add(q.b.tags,1)}});
  S.profile=p;
}
function seedBoards(){
  buildProfile();
  let items=[];ACC.forEach(a=>{if(S.links[a.k])items.push(...a.items)});
  if(items.length<4){const r=rank(items,new Set(items),[]);while(items.length<4&&r.length)items.push(r.shift().id)}
  items.push('lamy');
  S.boards=[{name:'My university self',items:[...new Set(items)],dismissed:[],forced:[]},{name:'My dream life',items:[],dismissed:[],forced:[]}];
  S.cur=0;S.addTo=0;
}
const vis=b=>S.priv.profile==='only me'?'only me':(b.vis||'public');
const VISL={'public':'Everyone','followers':'Followers','only me':'Only me'};

/* ---------- map drawing ---------- */
function cv(a,b,k){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y;return `M${f(a.x)},${f(a.y)} Q${f(mx-dy*k)},${f(my+dx*k)} ${f(b.x)},${f(b.y)}`}
function mapSVG(ids,hun,o={}){
  const W=350,H=470,C={x:175,y:238},n=ids.length;
  const rx=n<=6?100:112,ry=n<=6?132:150,off=n%2?0:18;
  const P={};
  ids.forEach((id,i)=>{const a=(-90+i*360/n+off)*Math.PI/180;P[id]={x:C.x+rx*Math.cos(a),y:C.y+ry*Math.sin(a)}});
  const Hs=hun.map((h,j)=>{const slots=Math.max(n,hun.length),g=n?Math.floor(j*n/hun.length)+.5:j+.25;
    const a=(-90+g*360/slots+off)*Math.PI/180;return Object.assign({},h,{x:C.x+126*Math.cos(a),y:C.y+196*Math.sin(a),r:9+8*h.s})});
  let s='';
  ids.forEach((id,i)=>s+=`<path d="${cv(C,P[id],.14)}" pathLength="1" class="draw" style="--d:${i*.05}s" fill="none" stroke="var(--label)" stroke-opacity=".3" stroke-width="1"/>`);
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=CAT[ids[i]],b=CAT[ids[j]];const sh=a.tags.filter(t=>b.tags.includes(t)).length;
    if(sh)s+=`<path d="${cv(P[ids[i]],P[ids[j]],(i+j)%2?.22:-.22)}" fill="none" stroke="var(--label)" stroke-opacity="${f(Math.min(.26,.08+sh*.06))}"/>`}
  Hs.forEach(h=>{const src=h.from&&P[h.from]?P[h.from]:C;s+=`<path d="${cv(src,h,.16)}" fill="none" stroke="var(--${CAT[h.id].t})" stroke-opacity=".65" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>`});
  const label=(x,y,t,w,c)=>`<text x="${f(x)}" y="${f(y)}" text-anchor="middle" font-size="11" font-weight="${w||500}" fill="${c||'var(--label)'}" stroke="var(--bg2)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">${esc(trunc(t,18))}</text>`;
  Hs.forEach((h,i)=>{const c=CAT[h.id];
    s+=`<g class="node" role="button" tabindex="0" data-act="${o.peek?'peek-item':'hunch'}" data-id="${h.id}" aria-label="Suggestion: ${esc(c.title)}"><g transform="translate(${f(h.x)},${f(h.y)})"><g class="bloom" style="--d:${.4+i*.15}s">
      <circle class="hit" r="${f(h.r+10)}"/><circle class="pulse" r="${f(h.r)}" fill="var(--${c.t})" fill-opacity=".08" stroke="var(--${c.t})" stroke-opacity=".7" stroke-width="1" stroke-dasharray="2.5 3"/>${glyph(c.t,h.r*.42,true)}</g></g>
      ${label(h.x,h.y+h.r+14,c.title,400,'var(--label2)')}</g>`});
  ids.forEach((id,i)=>{const c=CAT[id],p=P[id],isNew=o.newId===id;
    s+=`<g class="node" role="button" tabindex="0" data-act="${o.peek?'peek-item':'item'}" data-id="${id}" aria-label="${esc(c.title)}, ${TYPE[c.t]}"><g transform="translate(${f(p.x)},${f(p.y)})"><g class="bloom" style="--d:${isNew?0:.1+i*.05}s">
      <circle class="hit" r="24"/>${glyph(c.t,isNew?13:11)}</g></g>${label(p.x,p.y+26,c.title)}</g>`});
  s+=`<circle cx="${C.x}" cy="${C.y}" r="5" fill="var(--label)"/><text x="${C.x+11}" y="${C.y-8}" font-family="var(--serif)" font-style="italic" font-size="15" fill="var(--label)" stroke="var(--bg2)" stroke-width="5" paint-order="stroke">${esc(o.center||'You')}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Map">${s}</svg>`;
}
function miniSVG(items){
  const pts=[[34,50],[96,32],[160,26],[134,62],[64,66]];let s='';
  for(let i=1;i<Math.min(items.length,5);i++)s+=`<path d="${cv({x:pts[i-1][0],y:pts[i-1][1]},{x:pts[i][0],y:pts[i][1]},.25)}" fill="none" stroke="var(--label)" stroke-opacity=".22"/>`;
  items.slice(0,5).forEach((id,i)=>s+=`<g transform="translate(${pts[i][0]},${pts[i][1]})">${glyph(CAT[id].t,i===1?8:6)}</g>`);
  return `<svg viewBox="0 0 192 84" width="100%" height="84" aria-hidden="true">${s}</svg>`;
}

function onScrollFx(){const sc=$('.scroll.under');if(!sc)return;const y=sc.scrollTop,lg=$('#flogo'),ed=$('#edge'),open=$('#sbox')&&$('#sbox').classList.contains('open');

function hdr(left,right){return `<div class="top">${left||'<span style="width:44px"></span>'}<div class="r">${right||''}</div></div>`}

function common(k){const mine=new Set(S.boards.flatMap(b=>b.items));const n=PEOPLE[k].items.filter(i=>mine.has(i)).length;
  if(n)return `${n} thing${n>1?'s':''} in common`;const myt=new Set([...mine].flatMap(i=>CAT[i].tags));const t=PEOPLE[k].items.flatMap(i=>CAT[i].tags).find(x=>myt.has(x));return t?`You both like ${t} things`:'Something new for you';}

/* ---------- onboarding ---------- */
function welcomeField(){
  let r=7,s='';const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};const pts=[];let tries=0;
  while(pts.length<22&&tries++<4000){const p={x:24+rnd()*354,y:70+rnd()*560,r:3.5+Math.pow(rnd(),2)*8,t:TYPES[Math.floor(rnd()*5)]};
    if(Math.abs(p.x-201)<165&&Math.abs(p.y-400)<130)continue;
    if(pts.every(q=>Math.hypot(q.x-p.x,q.y-p.y)>q.r+p.r+30))pts.push(p)}
  pts.forEach((p,i)=>{const nb=pts.map((q,j)=>({j,d:Math.hypot(q.x-p.x,q.y-p.y)})).filter(o=>o.j>i).sort((a,b)=>a.d-b.d)[0];
    if(nb&&nb.d<170)s+=`<path d="${cv(p,pts[nb.j],.2)}" fill="none" stroke="var(--label)" stroke-opacity=".1"/>`});
  pts.forEach((p,i)=>s+=`<g transform="translate(${f(p.x)},${f(p.y)})"><g class="bloom" style="--d:${(i%12)*.06}s">${glyph(p.t,p.r)}</g></g>`);
  return `<svg class="wfield" viewBox="0 0 402 820" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${s}</svg>`;
}

      <h1 class="lt">Drawing <i>your map</i></h1><p class="sub" id="bmsg" aria-live="polite">Reading your saves…</p></div>`;
  }

function renderBubbles(){

function initBubbles(){
  const el=$('#bfield');if(!el)return;
  const b=cur(),excl=new Set([...S.boards.flatMap(x=>x.items),...b.dismissed]),L=rank(b.items,excl,S.pin);
  const sp=104,pos=[[0,0]];
  for(let ring=1;pos.length<L.length;ring++){let q=ring,r=0;const dirs=[[-1,1],[-1,0],[0,-1],[1,-1],[1,0],[0,1]];
    for(let d=0;d<6;d++)for(let s=0;s<ring;s++){pos.push([q,r]);q+=dirs[d][0];r+=dirs[d][1]}}
  const pts=L.map((x,i)=>{const [q,r]=pos[i];return{id:x.id,x:sp*(q+r/2),y:sp*.866*r}});
  el.innerHTML=pts.map((p,i)=>`<button class="bb" data-i="${i}" aria-label="${esc(CAT[p.id].title)}, ${TYPE[CAT[p.id].t]}">${cover(CAT[p.id],'round')}</button>`).join('');
  const els=[...el.children];
  B={raf:0,vx:0,vy:0,drag:null};
  const W=()=>el.clientWidth,H=()=>el.clientHeight;
  el.onpointerdown=e=>{try{el.setPointerCapture(e.pointerId)}catch(_){}const t=e.target.closest('.bb');B.drag={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:0,i:t?+t.dataset.i:-1,lt:performance.now()};B.vx=B.vy=0};
  el.onpointermove=e=>{const D=B.drag;if(!D)return;const sc=el.getBoundingClientRect().width/el.clientWidth||1;const dx=(e.clientX-D.lx)/sc,dy=(e.clientY-D.ly)/sc;
    BP.x+=dx;BP.y+=dy;D.moved=Math.max(D.moved,Math.hypot(e.clientX-D.sx,e.clientY-D.sy));const now=performance.now(),dt=Math.max(1,now-D.lt);B.vx=dx*16/dt;B.vy=dy*16/dt;D.lx=e.clientX;D.ly=e.clientY;D.lt=now};
  const up=()=>{const D=B.drag;B.drag=null;if(D&&D.moved<6&&D.i>=0){B.vx=B.vy=0;S.addTo=S.cur;discSheet(pts[D.i].id)}};
  el.onpointerup=up;el.onpointercancel=up;
  el.onkeydown=e=>{const t=e.target.closest&&e.target.closest('.bb');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.addTo=S.cur;discSheet(pts[+t.dataset.i].id)}};
  const step=()=>{
    if(!B.drag){BP.x+=B.vx;BP.y+=B.vy;B.vx*=.93;B.vy*=.93}
    const w=W(),hh=H(),cx=w/2,cy=hh/2,R=Math.min(w,hh)*.62;
    pts.forEach((p,i)=>{let x=p.x+BP.x+cx,y=p.y+BP.y+cy;const dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy);
      const t=Math.min(1,d/R),s=Math.max(.32,1-t*t*.7);const pull=.82+.18*s;x=cx+dx*pull;y=cy+dy*pull;
      const st=els[i].style;st.transform=`translate(${f(x-48)}px,${f(y-48)}px) scale(${s.toFixed(3)})`;st.opacity=d>R*1.6?0:1;st.zIndex=Math.round(s*100)});
    B.raf=requestAnimationFrame(step)};
  step();
}

  let h=L.slice(0,40).map(c=>`<div class="irow"><span class="tile" style="background:var(--bg2)">${icon(c.t,26)}</span><div class="m"><b>${esc(c.title)}</b><span>${esc(c.by)} · ${TYPE[c.t]}</span></div>
    ${b.items.includes(c.id)?'<span class="added">Added</span>':`<button class="glass circ" style="width:36px;height:36px" data-act="addit" data-id="${c.id}" aria-label="Add ${esc(c.title)}">${I.plus}</button>`}</div>`).join('');
  if(q&&!L.length)h=`<p class="sub" style="margin:20px 0 12px">Nothing called “${esc(S.aq)}” yet. Add it anyway as a:</p><div class="group">${TYPES.map(t=>`<button class="li ind" data-act="addcustom" data-t="${t}"><span class="tile" style="background:var(--bg)">${icon(t,24)}</span><span class="m"><b>${TYPE[t]}</b></span><span class="v">${I.chev}</span></button>`).join('')}</div>`;
  $('#addList').innerHTML=h;
}

/* ---------- actions ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
function addTo(bi,id){
  const b=S.boards[bi];if(b.items.includes(id))return;
  const before=new Set(hunches(b).map(h=>h.id));
  b.items.push(id);b.forced=b.forced.filter(x=>x!==id);S.pin=S.pin.filter(x=>x!==id);
  const nw=hunches(b).filter(h=>!before.has(h.id)).length;
  if(bi===S.cur)S.newId=id;
  toast(`Added to ${b.name}`+(nw?` · ${nw} new suggestion${nw>1?'s':''}`:''));
}
function startBuilding(){
  S.step='building';if(S.redo&&S.boards.length){buildProfile();S.redo=false}else seedBoards();render();
  const msgs=['Reading your saves…','Finding what goes together…','Comparing with 1,204 similar maps…'];let i=0;
  const iv=setInterval(()=>{i++;const el=$('#bmsg');if(el&&msgs[i])el.textContent=msgs[i]},800);
  setTimeout(()=>{clearInterval(iv);if(S.step!=='building')return;S.step='app';S.tab='board';render();toast('Your first map is ready')},2700);
}
function go(to){
  if(['welcome','connect','quiz'].includes(to)){S.step=to;if(to==='quiz')S.qi=0;render();return}
  if(!S.boards.length)seedBoards();
  S.step='app';S.viewing=null;S.flist=null;S.settings=to==='settings';S.tab=to==='discover'?'discover':'board';render();
}
function next(){if(S.qi<QS.length-1){S.qi++;render()}else startBuilding()}
function toggleWiz(on){const w=$('#wiz');w.hidden=on===undefined?!w.hidden:!on;
  if(!w.hidden)$('#wzItem').innerHTML=TYPES.map(t=>`<optgroup label="${PLURAL[t]}">${Object.values(CAT).filter(c=>c.t===t).map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</optgroup>`).join('')}
function resetAll(){try{localStorage.removeItem(KEY)}catch(e){}S.custom.forEach(c=>delete CAT[c.id]);S=fresh();closeSheet();closeMenu();render();toast('Back to the start')}

let taps=[];
function act(el){
  const a=el.dataset.act,id=el.dataset.id;
  if(el.closest('.menu'))closeMenu();
  switch(a){
    case 'wm':{const now=Date.now();taps=taps.filter(t=>now-t<700);taps.push(now);if(taps.length>=3){taps=[];toggleWiz()}return}
    case 'go':return go(el.dataset.to);
    case 'link':S.links[el.dataset.k]=!S.links[el.dataset.k];return render();
    case 'qback':if(S.qi>0){S.qi--;render()}else go('connect');return;
    case 'pick':{if(S.picking)return;const v=el.dataset.v;S.answers[S.qi]=v==='skip'?null:v;
      if(v==='skip'){next();return}S.picking=true;render();setTimeout(()=>{S.picking=false;next()},650);return}
    case 'tab':S.tab=el.dataset.t;S.viewing=null;S.settings=false;S.full=false;S.flist=null;S.bubbles=false;closeSheet();return render();
    case 'flist':S.flist=el.dataset.v;S.viewing=null;return render();
    case 'flseg':S.flist=el.dataset.v;return render();
    case 'unflist':S.flist=null;return render();
    case 'openboard':S.cur=+el.dataset.i;S.addTo=S.cur;S.tab='board';S.flist=null;return render();
    case 'editprof':return openProfSheet();
    case 'saveprof':{const n=$('#pname').value.trim(),hd=$('#phandle').value.trim(),bi=$('#pbio').value.trim();
      if(n)S.me.name=n;if(hd)S.me.handle=hd[0]==='@'?hd:'@'+hd;S.me.bio=bi;closeSheet();render();return toast('Profile saved')}
    case 'redoquiz':S.redo=true;S.step='quiz';S.qi=0;S.settings=false;return render();
    case 'full':S.full=true;return render();
    case 'unfull':S.full=false;return render();
    case 'boardmenu':return menu(el,[...S.boards.map((b,i)=>({label:b.name,act:'board',data:{i},on:i===S.cur})),'-',{label:'New map',act:'newboard'}]);
    case 'board':S.cur=+el.dataset.i;S.addTo=S.cur;return render();
    case 'newboard':S.boards.push({name:'New map '+(S.boards.length-1),items:[],dismissed:[],forced:[]});S.cur=S.boards.length-1;S.addTo=S.cur;render();return toast('New map. Start with a suggestion.');
    case 'item':return itemSheet(id);
    case 'hunch':return hunchSheet(id);
    case 'keep':closeSheet();addTo(S.cur,id);return render();
    case 'dismiss':cur().dismissed.push(id);cur().forced=cur().forced.filter(x=>x!==id);closeSheet();render();return toast('Got it. We’ll stop suggesting that.');
    case 'remove':{const b=cur();b.items=b.items.filter(x=>x!==id);b.dismissed.push(id);closeSheet();render();return toast('Removed from '+b.name)}
    case 'add':S.aq='';S.atype='all';return addSheet();
    case 'atype':S.atype=el.dataset.v;return fillAdd();
    case 'addit':closeSheet();addTo(S.cur,id);return render();
    case 'addcustom':{const cid='c'+Date.now(),c={id:cid,t:el.dataset.t,title:S.aq.trim(),by:'Added by you',tags:[]};S.custom.push(c);CAT[cid]=c;closeSheet();addTo(S.cur,cid);return render()}
    case 'dfilt':S.dfilt=el.dataset.v;return render();
    case 'disc':S.addTo=S.cur;return discSheet(id);
    case 'dsearch':return openSearch(true);
    case 'dsearchx':return openSearch(false);
    case 'bubbles':S.bubbles=true;closeSheet();return render();
    case 'unbubbles':S.bubbles=false;return render();
    case 'mix':return mixSheet(el.dataset.v);
    case 'savemix':{const t=el.dataset.v,items=mixItems(t,new Set(cur().items));S.boards.push({name:MIXN[t]||t,items,dismissed:[],forced:[]});S.cur=S.boards.length-1;S.addTo=S.cur;closeSheet();S.tab='board';S.bubbles=false;render();return toast('Saved as a new map')}
    case 'surprise':{const ex=new Set([...S.boards.flatMap(b=>b.items),...cur().dismissed]),pool=Object.values(CAT).filter(c=>!ex.has(c.id));if(pool.length){S.addTo=S.cur;discSheet(pool[Math.floor(Math.random()*pool.length)].id)}return}
    case 'pickboard':S.addTo=+el.dataset.i;return discSheet(id);
    case 'dadd':closeSheet();addTo(S.addTo,id);return render();
    case 'dskip':cur().dismissed.push(id);S.pin=S.pin.filter(x=>x!==id);closeSheet();render();return toast('Skipped');
    case 'peek':S.viewing=el.dataset.u;closeSheet();return render();
    case 'unpeek':S.viewing=null;return render();
    case 'peek-item':return peekSheet(id);
    case 'follow':{const k=el.dataset.u;S.follow[k]=!S.follow[k];render();return toast(S.follow[k]?'Following '+PEOPLE[k].h:'Unfollowed')}
    case 'settings':S.settings=true;closeSheet();return render();
    case 'unsettings':S.settings=false;return render();
    case 'pv':S.priv[el.dataset.k]=el.dataset.v;return render();
    case 'bvismenu':{const i=+el.dataset.i,b=S.boards[i];return menu(el,['public','followers','only me'].map(v=>({label:VISL[v],act:'bvis',data:{i,v},on:(b.vis||'public')===v})))}
    case 'bvis':S.boards[+el.dataset.i].vis=el.dataset.v;return render();
    case 'pswitch':S.priv[el.dataset.k]=!S.priv[el.dataset.k];return render();
    case 'toast':return toast(el.dataset.msg);
    case 'close':return closeSheet();
    case 'closemenu':return closeMenu();
    case 'hardreset':{const btn=$('#resetBtn'),sp=btn.querySelector('span');
      if(!btn.classList.contains('armed')){btn.classList.add('armed');sp.textContent='Tap again to reset';clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.classList.remove('armed');sp.textContent='Reset prototype'},3000);return}
      clearTimeout(btn._t);btn.classList.remove('armed');sp.textContent='Reset prototype';toggleWiz(false);return resetAll()}
    case 'wz-close':return toggleWiz(false);
    case 'wz-jump':closeSheet();closeMenu();S.settings=false;S.full=false;return go(el.dataset.to);
    case 'wz-board':{if(!S.boards.length)seedBoards();const v=$('#wzItem').value,b=cur();if(b.items.includes(v))return toast('Already on this map');
      b.dismissed=b.dismissed.filter(x=>x!==v);b.forced=[v,...b.forced.filter(x=>x!==v)];S.step='app';S.viewing=null;S.settings=false;S.tab='board';return render()}
    case 'wz-disc':{if(!S.boards.length)seedBoards();const v=$('#wzItem').value;S.pin=[v,...S.pin.filter(x=>x!==v)];S.dfilt='all';S.step='app';S.viewing=null;S.settings=false;S.tab='discover';return render()}
    case 'wz-undismiss':S.boards.forEach(b=>b.dismissed=[]);render();return toast('Skipped suggestions are back');
  }
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&!el.disabled)act(el)});
document.addEventListener('keydown',e=>{
  if(e.key==='`'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();toggleWiz();return}
  if(e.key==='Escape'){if($('#sbox')&&$('#sbox').classList.contains('open')&&$('#sheetWrap').hidden){openSearch(false);return}if(!$('#menuWrap').hidden)closeMenu();else if(!$('#sheetWrap').hidden)closeSheet();else if(!$('#wiz').hidden)toggleWiz(false);return}
  const el=e.target.closest&&e.target.closest('[data-act][role="button"]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();act(el)}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.aq=e.target.value;fillAdd()}else if(e.target.id==='dq')searchResults(e.target.value)});

function render(){
  let h;
  if(S.step==='app'&&!S.boards.length)seedBoards();
  if(G){cancelAnimationFrame(G.raf);G=null}
  if(B){cancelAnimationFrame(B.raf);B=null}
  if(S.step!=='app')h=renderOnb();
  else if(S.full&&S.tab==='board'&&!S.settings&&!S.viewing)h=renderFull();
  else if(S.bubbles&&S.tab==='discover'&&!S.settings&&!S.viewing&&!S.flist)h=renderBubbles();
  else if(S.settings)h=renderSettings();
  else if(S.viewing)h=renderPeek();
  else if(S.flist)h=renderFollowList();
  else{if(!['board','discover','account'].includes(S.tab))S.tab='account';h=({board:renderBoard,discover:renderDiscover,account:renderAccount})[S.tab]()+tabbar()}
  $('#screen').innerHTML=h;S.newId=null;save();
  if($('#graph'))initGraph();
  if($('#bfield'))initBubbles();
  const sc=$('.scroll.under');$('#screen').classList.toggle('flush',!!sc);if(sc){sc.onscroll=onScrollFx;onScrollFx()}
}
if(S.step==='building')S.step='quiz';
render();
</script>

</body></html>
